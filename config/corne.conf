

# # Uncomment the following line to enable the Kyria OLED Display
CONFIG_ZMK_DISPLAY=n
# CONFIG_ZMK_WPM=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=y

# # Turn on logging, and set ZMK logging to debug output
# #CONFIG_LOG=y
# #CONFIG_ZMK_LOG_LEVEL_DBG=y

# # Turn on USB CDC ACM device
# #CONFIG_USB=y
# #CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
# #CONFIG_USB_CDC_ACM_RINGBUF_SIZE=1024
# #CONFIG_USB_CDC_ACM_DEVICE_NAME="CDC_ACM"
# #CONFIG_USB_CDC_ACM_DEVICE_COUNT=1

# # Enable serial console
# #CONFIG_CONSOLE=y
# #CONFIG_UART_INTERRUPT_DRIVEN=y
# #CONFIG_UART_LINE_CTRL=y

# # Enable USB UART, and set the console device
# #CONFIG_UART_CONSOLE=y
# #CONFIG_USB_UART_CONSOLE=y
# CONFIG_UART_CONSOLE_ON_DEV_NAME="CDC_ACM_0"


# Cambiado de 240000 (4 min) a 900000 (15 min) a pedido explicito del
# usuario (coincide con el default de fabrica de ZMK para este valor).
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_SLEEP=y

# Intervalo de conexion BLE: ZMK usa por defecto 6/12 (7.5-15ms, prioriza
# latencia). Estos son los valores de fabrica de Zephyr (24/40 = 30-50ms),
# menos frecuencia de "despertar" el radio BLE = menos consumo, con
# latencia de tecleo igual imperceptible.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40

# RGB underglow (per-key + underglow chain on P0.06, see config/nice_nano_v2.overlay)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# Empieza apagado; F en adjust_layer lo enciende (ahorro de bateria)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# Se apaga automaticamente al entrar en idle, antes del sleep existente
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Brillo maximo limitado (evita LEDs excesivamente brillantes y ahorra bateria)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
# Velocidad y efecto por defecto: Breathe, lento y elegante
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=2
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=1

CONFIG_BT_MAX_CONN=3
# CONFIG_BT_MAX_PAIRED=3
CONFIG_ZMK_KEYBOARD_NAME="corne_ohtt"

# Battery
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Indicador de bateria con el LED azul integrado del nice!nano (independiente
# de los 27 LEDs RGB). Parpadea al iniciar mostrando el nivel; ajustar los
# umbrales si hace falta.
CONFIG_INDICATOR_LED_WIDGET=y
CONFIG_INDICATOR_LED_SHOW_BATTERY_ON_BOOT=y
CONFIG_INDICATOR_LED_BATTERY_LEVEL_HIGH=50
CONFIG_INDICATOR_LED_BATTERY_LEVEL_CRITICAL=10

