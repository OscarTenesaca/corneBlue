# PRUEBA DE DIAGNOSTICO: intercambio de rol central/periferico entre las
# mitades, para saber si el problema de desconexiones BLE es de la mitad
# izquierda especifica (placa/bateria/antena) o del rol "central" en
# general. Ver README.md.
#
# La mitad derecha pasa a ser "central" (la que se conecta directo al Mac).
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
