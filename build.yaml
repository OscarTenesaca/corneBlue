# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: corne_left
  - board: nice_nano_v2
    shield: corne_right
    # DEBUG TEMPORAL: snippet oficial de ZMK para logging por USB (agrega
    # el nodo devicetree CDC-ACM que falta en nice_nano_v2). Quitar esta
    # linea despues de diagnosticar el problema de RGB.
    snippet: zmk-usb-logging
