# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: corne_left
  - board: nice_nano_v2
    shield: corne_right
  # TEMPORAL: firmware de reset de configuracion (borra bonds Bluetooth,
  # estado RGB, seleccion de salida - NO toca el keymap). Flashear una vez
  # en cada mitad, luego volver a flashear el firmware normal de arriba.
  # Quitar esta entrada despues de usarla.
  - board: nice_nano_v2
    shield: settings_reset
